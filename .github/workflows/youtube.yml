name: Refresh YouTube cards

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_videos.py
      - .github/workflows/youtube.yml

permissions:
  contents: read

concurrency:
  group: profile-youtube-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test video updater
        run: python3 -m unittest discover -s tests -v
      - name: Refresh the selected tutorials
        run: python3 scripts/update_videos.py
      - name: Publish changed cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add README.md assets/videos
          if git diff --cached --quiet; then
            echo "Video cards are already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh YouTube video cards'
          gh auth setup-git
          git push origin HEAD:main
